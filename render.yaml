services:
  # --- Auth Microservice ---
  - type: web
    name: relaypost-auth-service
    runtime: python
    buildCommand: pip install -r auth_service/requirements.txt
    startCommand: cd auth_service && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard to your Neon Auth DB URL
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # Update this to your frontend URL once deployed
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # --- Content Microservice ---
  - type: web
    name: relaypost-content-service
    runtime: python
    buildCommand: pip install -r content_service/requirements.txt
    startCommand: cd content_service && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard to your Neon Content DB URL
      - key: CORS_ORIGINS
        value: "*" # Update this to your frontend URL once deployed
      - key: MEDIA_BASE_URL
        sync: false # Set this to https://relaypost-content-service.onrender.com after first deploy
      - key: JWT_SECRET
        sync: false # Must match the JWT_SECRET from auth-service
