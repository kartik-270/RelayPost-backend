```yaml
services:
  postgres:
    image: postgres:15-alpine
    container_name: relaypost_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - relaypost_network

  auth_service:
    build:
      context: ./auth_service

    container_name: auth_service
    restart: unless-stopped

    env_file:
      - ./auth_service/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    networks:
      - relaypost_network

  content_service:
    build:
      context: ./content_service

    container_name: content_service
    restart: unless-stopped

    env_file:
      - ./content_service/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8001:8001"

    networks:
      - relaypost_network

  news_service:
    build:
      context: ./news_service

    container_name: news_service
    restart: unless-stopped

    env_file:
      - ./news_service/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8002:8002"

    networks:
      - relaypost_network

networks:
  relaypost_network:
    driver: bridge

volumes:
  postgres_data:
```
