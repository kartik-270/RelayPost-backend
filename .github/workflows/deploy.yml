name: Deploy RelayPost Backend

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          set -e

          cd ~/app/RelayPost-backend

          echo "Current branch:"
          git branch --show-current

          echo "Fetching latest code..."
          git fetch origin prod

          OLD_COMMIT=$(git rev-parse HEAD)

          git checkout prod
          git reset --hard origin/prod

          git clean -fd

          echo "Changed files:"
          CHANGED_FILES=$(git diff --name-only "$OLD_COMMIT" HEAD)
          echo "$CHANGED_FILES"

          AUTH_CHANGED=false
          CONTENT_CHANGED=false
          NEWS_CHANGED=false
          NEWS_GENERATION_CHANGED=false
          TRACKING_CHANGED=false

          if echo "$CHANGED_FILES" | grep -q "^auth_service/"; then
            AUTH_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^content_service/"; then
            CONTENT_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^news_service/"; then
            NEWS_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^news_generation_service/"; then
            NEWS_GENERATION_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^tracking_service/"; then
            TRACKING_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^docker-compose.yml"; then
            AUTH_CHANGED=true
            CONTENT_CHANGED=true
            NEWS_CHANGED=true
            NEWS_GENERATION_CHANGED=true
            TRACKING_CHANGED=true
          fi

          echo "Cleaning up old Docker data to free up space..."
          docker system prune -af || true
          docker builder prune -af || true

          if [ "$AUTH_CHANGED" = true ]; then
            echo "Deploying auth_service..."
            docker compose build auth_service
            docker compose up -d auth_service
          fi

          if [ "$CONTENT_CHANGED" = true ]; then
            echo "Deploying content_service..."
            docker compose build content_service
            docker compose up -d content_service
          fi

          if [ "$NEWS_CHANGED" = true ]; then
            echo "Deploying news_service..."
            docker compose build news_service
            docker compose up -d news_service
          fi

          if [ "$NEWS_GENERATION_CHANGED" = true ]; then
            echo "Deploying news_generation_service..."
            docker compose build news_generation_service
            docker compose up -d news_generation_service
          fi

          if [ "$TRACKING_CHANGED" = true ]; then
            echo "Deploying tracking_service..."
            docker compose build tracking_service
            docker compose up -d tracking_service
          fi

          echo "Pruning old Docker images..."
          docker image prune -f

          echo "Deployment completed successfully."

          EOF